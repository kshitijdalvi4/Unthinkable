services:
  - type: web
    name: unthinkable-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt && playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
